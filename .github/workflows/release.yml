name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'custom_components/ortsnetz_auslastung/manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
  hassfest:
    uses: ./.github/workflows/hassfest.yaml
  hacs:
    uses: ./.github/workflows/validate.yaml

  release:
    needs: [tests, hassfest, hacs]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version | select(type == "string")' custom_components/ortsnetz_auslastung/manifest.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version such as 1.0.2, got: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG points to a different commit; increase the manifest version."
              exit 1
            fi
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
